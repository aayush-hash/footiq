[project]
name = "footiq"
version = "0.1.0"
description = "FOOTIQ football prediction models"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "jupyter"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["footiq"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
